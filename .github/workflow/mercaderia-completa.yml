name: Actualizar precios y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 09:00 Argentina; GitHub puede demorar el inicio.
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mercaderia-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar archivos o actualizar la versión anterior
        run: |
          python - <<'PYBOOT'
          import base64,gzip,json,pathlib,hashlib
          files=json.loads(gzip.decompress(base64.b64decode('')))
          previous={'README.md': 'e051a486a105420f087c061695cd8f17dc7fee8b71c9b6b2d751dd070d6692c7', '.gitignore': 'b90e00de84a3e9ca08889eae0cb1f1c714466c45fb11a311fc25aef7718da68d', 'package.json': '483681eba000e3b6133e6181aed711ded62b204bd227003ac1a5295c7ed009ee', 'index.html': '9f6dc2d6e0ffd3e3cd83d30343bfbde8d10178aa836cfe2a71f1e2b0f5f5594a', 'data/catalogo.json': '20ee2d96d3eb52104b9f21a32ad10f2adeb35c0d801fe94586cd35862d937414', 'data/precios.json': '31e1aa0a0176bdd66e7c37a7c0107957ec675801081e25c26f2aeaf3e1daed2a', 'src/core.mjs': '0c552c08b8a8ba06f2fc5a116273f56165ef3d61493b74dd0041633773ec2c44', 'src/sources.mjs': '32ec1027158d803603eab5a1dca98a24eac14539c7246c37eaed3a0b103827d4', 'src/page.html': '1702467aa08e2314eed39e01fbf10fb54d87f50e70238d573608e394de4fccf3', 'scripts/build.mjs': 'b0cc18d240795f92742967be4851359490a71a92689fe95de2cc13e0ff5c115c', 'scripts/actualizar.mjs': '1e6dc8a90cae8ed5053c39478c73123b2552fa943e58d26d5f85366f4d49b596', 'tests/core.test.mjs': '0f04046b911fd03f118df8fd21032b1c9f5c8e85b0e0ad7f04fc835286fd161c', 'src/html-sources.mjs': 'c9a31be3a3f7834cb5e5278e10e52d26a7a0111f23c220cca46213620eccb860', 'tests/fixtures/gallega.html': '7af3e8afa53fd0c8fdc8a1ce3a83a388228f39a8751450c3d2f45a2bf221b57a', 'tests/fixtures/reina.html': '6638b13cdf4c8fdb8c8cbf94cc7b9f26ab76facb54e338ce6b9b1adbe75d435d', 'tests/fixtures/unico.html': '228b026e447c6b6d84c71259252b7c1b0f8d98ca0d5dbe7aa01a6f0970b55e91'}
          for name,content in files.items():
              path=pathlib.Path(name)
              if path.is_absolute() or '..' in path.parts or '.github' in path.parts:
                  raise SystemExit('Ruta de instalación inválida')
              if path.exists() and path.read_text()!=content and name not in ('data/precios.json','index.html'):
                  current=path.read_text()
                  original_readme=name=='README.md' and current.strip() in ('# Mercaderia\nMercaderia','# Mercaderia')
                  if not original_readme and hashlib.sha256(current.encode()).hexdigest()!=previous.get(name):
                      raise SystemExit('Se conservó un archivo con cambios propios; revisar antes de actualizar: '+name)
          for name,content in files.items():
              path=pathlib.Path(name)
              if name=='data/precios.json' and path.exists():
                  old=json.loads(path.read_text());new=json.loads(content)
                  records={(r['storeId'],r['itemId']):r for r in new['records']}
                  for record in old.get('records',[]):
                      if record.get('normalizationVersion')!=2: continue
                      key=(record['storeId'],record['itemId'])
                      if key not in records or record['checkedAt']>records[key]['checkedAt']:records[key]=record
                  new['records']=list(records.values())
                  if old.get('normalizationVersion')==2:
                      for key,value in old.get('checks',{}).items():
                          if value.get('at','')>new.get('checks',{}).get(key,{}).get('at',''):new['checks'][key]=value
                      if old.get('at','')>new.get('at',''):new['at']=old['at']
                  for store,items in old.get('diagnostics',{}).items():
                      target=new.setdefault('diagnostics',{}).setdefault(store,{})
                      for item,diagnostic in items.items():
                          if diagnostic.get('at','')>target.get(item,{}).get('at',''):target[item]=diagnostic
                  content=json.dumps(new,ensure_ascii=False,indent=2)+'\n'
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content,encoding='utf-8')
          print('Instalados o actualizados',len(files),'archivos. Se conservaron observaciones más recientes y cambios propios.')
          PYBOOT
      - name: Verificar cálculos
        run: npm test
      - name: Consultar catálogos y conservar datos ante fallas
        run: npm run update
      - name: Verificar datos y generar HTML
        run: |
          npm test
          npm run build
      - name: Guardar precios e historial
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore package.json index.html data src scripts tests
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar precios observados de la canasta'
            git push origin HEAD:main
          fi
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Comprobar si GitHub Pages está habilitado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=await fetch(`https://api.github.com/repos/${process.env.GITHUB_REPOSITORY}/pages`,{headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,'X-GitHub-Api-Version':'2022-11-28'}});
          if(r.status!==200&&r.status!==404)throw Error(`No se pudo consultar Pages: HTTP ${r.status}`);
          const p=r.status===200?await r.json():null;
          const enabled=p?.build_type==='workflow';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,`enabled=${enabled}\n`);
          if(!enabled)console.log('::notice::Falta activar Settings > Pages > Source: GitHub Actions. Luego volver a ejecutar esta tarea.');
          JS
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
