name: Actualizar precios y publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 12 * * *' # 09:00 Argentina; GitHub puede demorar el inicio.
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: mercaderia-main
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      pages_enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Aplicar MicroGo y normalizar cantidades
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          
          PAGE_SCRIPT = r"""const CATALOG=__CATALOG__,STORES=__STORES__;
          const PLANNER=__PLANNER__;
          let data=__SNAPSHOT__,selected=new Set(JSON.parse(localStorage.getItem('canasta-selection')||'null')||CATALOG.map(x=>x.id));
          let active='prices';
          const $=x=>document.getElementById(x);
          const money=c=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:2}).format(c/100);
          const esc=s=>String(s).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
          const date=s=>new Date(s).toLocaleString('es-AR',{timeZone:'America/Argentina/Cordoba'});
          const unitName=u=>({u:'unidades',g:'g',ml:'ml',m:'metros',hojas:'hojas'}[u]||u);
          const referenceLabel=i=>i.amount+' '+unitName(i.unit);
          const comparisonOf=r=>r?.comparison||r;
          const sameOffer=(r,c)=>r&&c&&r.name===c.name&&r.url===c.url&&r.priceCents===c.priceCents&&r.quantity===c.quantity;
          function fresh(){return data.records.filter(r=>r.normalizationVersion===2&&Date.now()-Date.parse(r.checkedAt)<36*3600000)}
          function picks(){return CATALOG.filter(i=>selected.has(i.id))}
          function eligibleRecords(item,records){return records.filter(r=>r.itemId===item.id&&STORES.find(s=>s.id===r.storeId)?.planningEligible!==false)}
          function bestEquivalent(rows){return [...rows].sort((a,b)=>comparisonOf(a).unitCostCents-comparisonOf(b).unitCostCents||comparisonOf(a).costCents-comparisonOf(b).costCents)[0]}
          function leastOutlay(rows){return [...rows].sort((a,b)=>a.costCents-b.costCents||comparisonOf(a).unitCostCents-comparisonOf(b).unitCostCents)[0]}
          function offerDetails(item,record,offer=comparisonOf(record)){
            return '<a href="'+esc(offer.url)+'" target="_blank" rel="noopener">'+esc(offer.name)+'</a>'+
              '<small>Presentación real: '+offer.quantity+' '+unitName(item.unit)+' · precio real del envase '+money(offer.priceCents)+'</small>'+
              '<small>Para cubrir '+referenceLabel(item)+': '+offer.packs+' envase(s) entero(s) · desembolso '+money(offer.costCents)+'</small>';
          }
          function comparisonDetails(item,records){
            const rows=records.filter(r=>r.itemId===item.id).sort((a,b)=>comparisonOf(a).unitCostCents-comparisonOf(b).unitCostCents);
            if(!rows.length)return '';
            return '<details style="padding:8px;margin:6px 0;min-width:240px"><summary>Ver cada supermercado</summary>'+rows.map(r=>{
              const s=STORES.find(s=>s.id===r.storeId),c=comparisonOf(r);
              const other=sameOffer(r,c)?'':'<small><b>Menor desembolso en esta tienda:</b> '+esc(r.name)+' · '+r.packs+' envase(s) · '+money(r.costCents)+'</small>';
              return '<p><strong>'+s.name+(s.planningEligible===false?' · referencia':'')+'</strong><span class="price">'+money(c.unitCostCents)+'</span><small>Precio equivalente por '+referenceLabel(item)+'</small>'+offerDetails(item,r,c)+other+'<small>Revisado '+date(r.checkedAt)+(r.availabilityVerified===false?' · stock a confirmar':'')+'</small></p>';
            }).join('')+'</details>';
          }
          function render(){
            const rec=fresh(),items=picks();
            $('count').textContent=items.length+' artículos en tu lista · '+rec.length+' precios vigentes';
            $('stores').innerHTML=STORES.map(s=>'<span class="chip"><i class="dot '+(rec.some(r=>r.storeId===s.id)?'ok':'')+'"></i>'+s.name+'</span>').join('');
            const filter=$('search').value.toLowerCase();
            $('rows').innerHTML=CATALOG.filter(i=>(!$('category').value||i.category===$('category').value)&&i.name.toLowerCase().includes(filter)).map(i=>{
              const rr=eligibleRecords(i,rec),value=bestEquivalent(rr),outlay=leastOutlay(rr),c=comparisonOf(value);
              const different=value&&outlay&&(value.storeId!==outlay.storeId||!sameOffer(outlay,c));
              return '<tr><td><input type="checkbox" aria-label="Incluir '+esc(i.name)+'" data-id="'+i.id+'" '+(selected.has(i.id)?'checked':'')+'></td>'+
                '<td><strong>'+i.name+'</strong><small>Referencia común: '+referenceLabel(i)+' · '+i.category+'</small></td>'+
                '<td>'+(value?'<span class="badge">'+STORES.find(s=>s.id===value.storeId).name+'</span><div class="price">'+money(c.unitCostCents)+'</div><small>Precio equivalente por '+referenceLabel(i)+'</small>':'<span class="muted">Sin precio verificado</span>')+'</td>'+
                '<td>'+(value?offerDetails(i,value,c)+(different?'<small><b>Menor desembolso:</b> '+STORES.find(s=>s.id===outlay.storeId).name+' · '+esc(outlay.name)+' · '+money(outlay.costCents)+'</small>':''):'<small>Esperando una consulta válida</small>')+'</td>'+
                '<td>'+rr.length+'/'+STORES.filter(s=>s.planningEligible!==false).length+' tiendas del plan'+comparisonDetails(i,rec)+'</td></tr>';
            }).join('');
            $('totalcards').innerHTML=STORES.map(s=>{
              const rr=rec.filter(r=>r.storeId===s.id&&selected.has(r.itemId)),complete=items.length>0&&rr.length===items.length;
              return '<div class="card"><h3>'+s.name+'</h3><span class="badge">'+rr.length+'/'+items.length+' artículos</span><p class="price">'+(rr.length?money(rr.reduce((a,r)=>a+r.costCents,0)):'—')+'</p><p class="muted">'+(s.planningEligible===false?'Solo referencia · fuera del plan Rosario':complete?'Total a pagar por envases enteros':'Subtotal incompleto · no permite decidir el más barato')+'</p></div>';
            }).join('');
            const plan=PLANNER(items,rec,+$('stops').value,Math.max(0,+$('travel').value||0)*100),one=PLANNER(items,rec,1,0);
            if(!plan){
              $('combination').innerHTML='<div class="empty"><strong>'+(items.length?'Todavía no hay cobertura para completar tu lista.':'Elegí los artículos que querés comprar.')+'</strong><br>Seleccioná artículos con precio para explorar una combinación. Los faltantes no se consideran gratis.</div>';
            }else{
              let html='<div class="plan"><small>MEJOR COMBINACIÓN POR DESEMBOLSO REAL · '+plan.stops+' PARADA(S)</small><p class="price">'+money(plan.net)+'</p><div>Envases enteros '+money(plan.sum)+' + traslados '+money(plan.net-plan.sum)+'</div>'+(one?'<p>Ahorro neto frente a la mejor compra en un solo súper: '+money(one.sum-plan.net)+'</p>':'<p>Sin compra completa en un solo supermercado para comparar el ahorro.</p>')+'</div>';
              for(const s of STORES){
                const rr=plan.picks.filter(p=>p.storeId===s.id);
                if(rr.length)html+='<div class="card" style="margin:12px 0"><h3>'+s.name+' · '+money(rr.reduce((a,r)=>a+r.costCents,0))+'</h3>'+rr.map(r=>{const i=CATALOG.find(i=>i.id===r.itemId);return '<p>'+i.name+' · referencia '+referenceLabel(i)+' — '+esc(r.name)+' · '+r.packs+' envase(s) entero(s) de '+r.quantity+' '+unitName(i.unit)+' · <b>'+money(r.costCents)+'</b></p>'}).join('')+'</div>';
              }
              html+='<p class="muted">Los totales y el ahorro usan envases enteros, nunca fracciones proporcionales. Confirmá precios y disponibilidad antes de trasladarte.</p>';
              $('combination').innerHTML=html;
            }
            $('sourcecards').innerHTML=STORES.map(s=>{const c=data.checks[s.id];return '<details><summary>'+s.name+' · '+rec.filter(r=>r.storeId===s.id).length+' precios vigentes</summary><p><a href="'+s.url+'" target="_blank" rel="noopener">Tienda oficial</a></p><p>'+esc(c?.message||'Sin consulta completada')+'</p><small>'+(c?.at?date(c.at):'')+'</small><p>'+esc(s.note||(s.localVerified?'Tienda de Rosario identificada. Confirmá disponibilidad antes de ir.':'Sucursal y entrega en Rosario por confirmar. Precios de catálogo online.'))+'</p></details>'}).join('');
          }
          async function load(){
            try{
              const r=await fetch('./data/precios.json?control='+Date.now(),{cache:'no-store'});
              if(!r.ok)throw Error();
              data=await r.json();
              $('status').textContent='Último control: '+(data.at?date(data.at):'pendiente')+' · Precios válidos durante 36 h';
            }catch{
              $('status').textContent='Mostrando la consulta incluida en esta versión · '+(data.at?date(data.at):'sin fecha');
            }
            render();
          }
          function exportList(){
            const rows=[['Artículo','Cantidad de referencia','Unidad','Supermercado mejor equivalente','Producto comparado','Precio equivalente ARS','Presentación real','Precio real del envase ARS','Envases enteros para referencia','Desembolso del producto comparado ARS','Supermercado menor desembolso','Producto menor desembolso','Desembolso mínimo ARS','URL']];
            for(const i of picks()){
              const rr=eligibleRecords(i,fresh()),value=bestEquivalent(rr),outlay=leastOutlay(rr),c=comparisonOf(value);
              rows.push([i.name,i.amount,unitName(i.unit),value?STORES.find(s=>s.id===value.storeId).name:'Sin precio',c?.name||'',c?c.unitCostCents/100:'',c?c.quantity+' '+unitName(i.unit):'',c?c.priceCents/100:'',c?.packs||'',c?c.costCents/100:'',outlay?STORES.find(s=>s.id===outlay.storeId).name:'',outlay?.name||'',outlay?outlay.costCents/100:'',c?.url||'']);
            }
            const a=document.createElement('a');
            a.href=URL.createObjectURL(new Blob(['\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(';')).join('\n')],{type:'text/csv;charset=utf-8'}));
            a.download='mi-canasta.csv';a.click();URL.revokeObjectURL(a.href);
          }
          document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{active=b.dataset.tab;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('active',p.id===active))});
          $('category').innerHTML+=[...new Set(CATALOG.map(i=>i.category))].sort().map(c=>'<option>'+c+'</option>').join('');
          $('search').oninput=render;$('category').onchange=render;$('stops').onchange=render;$('travel').oninput=render;
          function save(){localStorage.setItem('canasta-selection',JSON.stringify([...selected]));render()}
          $('available').onclick=()=>{selected=new Set(fresh().map(r=>r.itemId));save()};
          $('all').onclick=()=>{selected=new Set(CATALOG.map(i=>i.id));save()};
          $('none').onclick=()=>{selected.clear();save()};
          $('rows').onchange=e=>{if(e.target.dataset.id){e.target.checked?selected.add(e.target.dataset.id):selected.delete(e.target.dataset.id);save()}};
          $('export').onclick=exportList;
          $('refresh').onclick=()=>{window.open('https://github.com/paredesivan/Mercaderia/actions/workflows/mercaderia-completa.yml','_blank','noopener');$('progress').textContent='En GitHub tocá Run workflow para consultar precios nuevos. Al terminar, recargá esta página.'};
          load();
          """
          TEST_SUFFIX = r"""const product=(store,name,price)=>({productName:name,link:store.url+'/'+encodeURIComponent(name),items:[{nameComplete:name,measurementUnit:'un',unitMultiplier:1,sellers:[{commertialOffer:{Price:price,AvailableQuantity:99}}]}]});
          test('huevos x6, x12 y x30 se comparan por 6 pero conservan el desembolso real',()=>{
           const store=stores.find(s=>s.id==='microgo'),item={id:'3',amount:6,unit:'u',include:'^huevos'};
           const r=choose([product(store,'Huevos x 6 un',3600),product(store,'Huevos x 12 un',6000),product(store,'Huevos x 30 un',12000)],item,store,'2026-10-20');
           assert.equal(r.name,'Huevos x 6 un');assert.equal(r.costCents,360000);
           assert.equal(r.comparison.name,'Huevos x 30 un');assert.equal(r.comparison.unitCostCents,240000);
           assert.equal(r.comparison.priceCents,1200000);assert.equal(r.comparison.quantity,30);
          });
          test('manteca de 100 y 200 g separa precio equivalente de compra real',()=>{
           const store=stores.find(s=>s.id==='microgo'),item={id:'1',amount:100,unit:'g',include:'^manteca'};
           const products=[product(store,'Manteca 100 g',1200),product(store,'Manteca 200 g',1800)];
           const r=choose(products,item,store,'2026-10-20');
           assert.equal(r.name,'Manteca 100 g');assert.equal(r.costCents,120000);
           assert.equal(r.comparison.name,'Manteca 200 g');assert.equal(r.comparison.unitCostCents,90000);
           assert.equal(r.comparison.costCents,180000);
          });"""
          
          def save(path, text):
              Path(path).write_text(text, encoding='utf-8')
          
          p=Path('src/core.mjs');s=p.read_text(encoding='utf-8')
          replacement="{id:'microgo',name:'MicroGo / Micropack',url:'https://www.microgo.com.ar',type:'vtex',note:'Tienda online con envío y retiro en Rosario; precio online sin sucursal específica.'},"
          s=re.sub(r"\{id:'mas'[^\n]*\},",replacement,s)
          if "id:'microgo'" not in s or "id:'mas'" in s:
              raise SystemExit('No se pudo reemplazar ChangoMás por MicroGo de forma segura')
          old=" return candidates.sort((a,b)=>a.costCents-b.costCents||a.unitCostCents-b.unitCostCents)[0]||null;"
          new=""" if(!candidates.length)return null;
           const purchase=[...candidates].sort((a,b)=>a.costCents-b.costCents||a.unitCostCents-b.unitCostCents)[0];
           const comparison=[...candidates].sort((a,b)=>a.unitCostCents-b.unitCostCents||a.costCents-b.costCents)[0];
           return {...purchase,comparison:{name:comparison.name,brand:comparison.brand,priceCents:comparison.priceCents,quantity:comparison.quantity,unit:comparison.unit,packs:comparison.packs,costCents:comparison.costCents,unitCostCents:comparison.unitCostCents,url:comparison.url}};"""
          if old in s:s=s.replace(old,new,1)
          elif 'const comparison=[...candidates]' not in s:raise SystemExit('La función choose cambió y no se modificó para evitar una corrección insegura')
          save(p,s)
          
          p=Path('data/catalogo.json');catalog=json.loads(p.read_text(encoding='utf-8'))
          egg=next((i for i in catalog if str(i.get('id'))=='3'),None)
          if not egg or egg.get('name')!='Huevos':raise SystemExit('No se encontró el artículo Huevos esperado')
          egg['amount']=6
          save(p,json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')
          
          p=Path('data/precios.json');data=json.loads(p.read_text(encoding='utf-8'))
          data['records']=[r for r in data.get('records',[]) if r.get('storeId')!='mas']
          for key in ('checks','diagnostics'):data.get(key,{}).pop('mas',None)
          save(p,json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          
          p=Path('src/page.html');html=p.read_text(encoding='utf-8')
          if '<script>' not in html or '</script>' not in html:raise SystemExit('No se encontró el script de la interfaz')
          before,tail=html.split('<script>',1);_,after=tail.rsplit('</script>',1)
          html=before+'<script>\n'+PAGE_SCRIPT.strip()+'\n</script>'+after
          html=html.replace('Menor costo observado','Mejor precio equivalente')
          html=html.replace('Producto y presentación','Presentación real y desembolso')
          html=html.replace('El menor costo corresponde a los envases enteros necesarios para cubrir la cantidad elegida. Las marcas pueden variar. Es el mínimo encontrado en la consulta, no una garantía de mínimo de todo el catálogo.','El precio equivalente compara siempre la misma cantidad entre supermercados. La presentación real indica el envase que existe y cuánto se paga por él. Los totales usan únicamente envases enteros; nunca suponen que se puede comprar una fracción.')
          html=html.replace('La misma lista en cada supermercado','La misma lista, pagando envases enteros en cada supermercado')
          save(p,html)
          
          p=Path('tests/core.test.mjs');tests=p.read_text(encoding='utf-8').replace('https://www.masonline.com.ar','https://www.microgo.com.ar')
          if 'huevos x6, x12 y x30 se comparan por 6' not in tests:tests=tests.rstrip()+'\n'+TEST_SUFFIX+'\n'
          save(p,tests)
          
          p=Path('README.md');readme=p.read_text(encoding='utf-8')
          readme=readme.replace('| ChangoMás | Catálogo online | Sucursal Rosario sin confirmar |','| MicroGo / Micropack | Catálogo online | Envío y retiro en Rosario; precios online sin atribuir a una sucursal específica |')
          line='- Precio equivalente para una cantidad común y, por separado, precio real y presentación de cada envase.\n'
          anchor='- Costo de los envases enteros necesarios para cada cantidad de referencia.\n'
          if line not in readme:readme=readme.replace(anchor,line+anchor)
          paragraph='Cada artículo usa una cantidad de referencia única en todas las tiendas (por ejemplo, huevos por 6 unidades). La tabla ordena por precio equivalente para esa cantidad, pero muestra también la presentación real y el precio real del envase. Los totales y el plan de compras usan solamente envases enteros y distinguen el menor desembolso del mejor precio proporcional cuando no coinciden.'
          if paragraph not in readme:
              marker='Las comparaciones se regeneran con la versión 2 del normalizador; no se reutilizan cantidades de la versión anterior sin revisarlas.'
              readme=readme.replace(marker,marker+'\n\n'+paragraph)
          save(p,readme)
          print('MicroGo configurado; comparación común y desembolsos reales separados.')
          PY
      - name: Verificar cálculos
        run: npm test
      - name: Consultar catálogos y conservar datos ante fallas
        run: npm run update
      - name: Verificar datos y generar HTML
        run: |
          npm test
          npm run build
      - name: Guardar precios e historial
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md .gitignore package.json index.html data src scripts tests
          if ! git diff --cached --quiet; then
            git commit -m 'Actualizar precios observados de la canasta'
            git push origin HEAD:main
          fi
      - name: Preparar sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Comprobar si GitHub Pages está habilitado
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const r=await fetch('https://api.github.com/repos/'+process.env.GITHUB_REPOSITORY+'/pages',{headers:{Authorization:'Bearer '+process.env.GH_TOKEN,'X-GitHub-Api-Version':'2022-11-28'}});
          if(r.status!==200&&r.status!==404)throw Error('No se pudo consultar Pages: HTTP '+r.status);
          const p=r.status===200?await r.json():null;
          const enabled=p?.build_type==='workflow';
          fs.appendFileSync(process.env.GITHUB_OUTPUT,'enabled='+enabled+'\\n');
          if(!enabled)console.log('::notice::Falta activar Settings > Pages > Source: GitHub Actions. Luego volver a ejecutar esta tarea.');
          JS
  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publicar web
        id: deployment
        uses: actions/deploy-pages@v4
